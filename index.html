<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Truck Life: Delivery Simulator</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

/* ================= HUD ================= */

#hud{
    position:fixed;
    top:12px;
    left:12px;
    z-index:20;
    color:white;
    background:rgba(0,0,0,.58);
    border:1px solid rgba(255,255,255,.15);
    border-radius:12px;
    padding:10px 14px;
    font-size:14px;
    line-height:1.5;
    backdrop-filter:blur(6px);
    pointer-events:none;
}

#title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:3px;
}

#status{
    color:#ddd;
}

/* ================= ROTATE SCREEN ================= */

#rotateMessage{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    background:#111;
    color:white;
    padding:30px;
}

#rotateMessage .phone{
    font-size:60px;
    margin-bottom:15px;
}

#rotateMessage h2{
    margin:0 0 8px;
}

#rotateMessage p{
    margin:0;
    color:#bbb;
}

/* ================= JOYSTICK ================= */

#joystickArea{
    position:fixed;
    left:20px;
    bottom:22px;
    width:150px;
    height:150px;
    z-index:30;
    touch-action:none;
}

#joystickBase{
    position:absolute;
    left:15px;
    top:15px;
    width:120px;
    height:120px;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.28);
    box-shadow:
        inset 0 0 25px rgba(0,0,0,.25),
        0 4px 15px rgba(0,0,0,.2);
}

#joystickStick{
    position:absolute;
    left:45px;
    top:45px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:rgba(255,255,255,.38);
    border:2px solid rgba(255,255,255,.6);
    box-shadow:0 4px 12px rgba(0,0,0,.3);
}

/* ================= CAMERA AREA ================= */

#lookArea{
    position:fixed;
    right:0;
    top:0;
    width:58%;
    height:100%;
    z-index:10;
    touch-action:none;
}

/* ================= SMALL BUTTONS ================= */

#buttons{
    position:fixed;
    right:18px;
    bottom:20px;
    z-index:30;
    display:flex;
    gap:10px;
    pointer-events:none;
}

.actionButton{
    width:58px;
    height:58px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    color:white;
    font-size:22px;
    border:1px solid rgba(255,255,255,.25);
    pointer-events:auto;
}

.actionButton:active{
    background:rgba(255,255,255,.3);
}

/* ================= DESKTOP ================= */

#keyboardHint{
    position:fixed;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    color:rgba(255,255,255,.7);
    background:rgba(0,0,0,.4);
    padding:6px 12px;
    border-radius:8px;
    font-size:12px;
    pointer-events:none;
}

/* ================= LANDSCAPE ================= */

@media (orientation:portrait){
    #rotateMessage{
        display:flex;
    }
}

@media (orientation:landscape){
    #rotateMessage{
        display:none;
    }
}

@media (min-width:800px){
    #joystickArea{
        left:28px;
        bottom:28px;
    }

    #buttons{
        right:28px;
        bottom:28px;
    }
}
</style>
</head>

<body>

<div id="rotateMessage">
    <div class="phone">📱↻</div>
    <h2>Rotate Your Phone</h2>
    <p>Truck Life is designed for landscape mode.</p>
</div>

<div id="hud">
    <div id="title">🚚 Truck Life</div>
    <div id="status">Explore the world</div>
    <div>Speed: <span id="speed">0</span></div>
</div>

<div id="joystickArea">
    <div id="joystickBase"></div>
    <div id="joystickStick"></div>
</div>

<div id="lookArea"></div>

<div id="buttons">
    <button class="actionButton" id="resetCamera">↻</button>
</div>

<div id="keyboardHint">
    WASD / Arrow Keys • Drag right side to look
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(
    0x87ceeb,
    60,
    230
);


/* =========================================================
   CAMERA
========================================================= */

const camera = new THREE.PerspectiveCamera(
    65,
    window.innerWidth / window.innerHeight,
    0.1,
    500
);


/* =========================================================
   RENDERER
========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
========================================================= */

const hemi = new THREE.HemisphereLight(
    0xffffff,
    0x668866,
    1.5
);

scene.add(hemi);


const sun = new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(
    50,
    80,
    30
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;

scene.add(sun);


/* =========================================================
   MATERIAL HELPERS
========================================================= */

function mat(color){
    return new THREE.MeshStandardMaterial({
        color:color,
        roughness:.8,
        metalness:.05
    });
}


/* =========================================================
   GROUND
========================================================= */

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(350,350),
    mat(0x4f7942)
);

ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   ROAD
========================================================= */

const road = new THREE.Mesh(
    new THREE.PlaneGeometry(350,18),
    mat(0x303238)
);

road.rotation.x = -Math.PI/2;
road.position.y = .015;

road.receiveShadow = true;

scene.add(road);


/* =========================================================
   ROAD MARKINGS
========================================================= */

for(let z=-170; z<170; z+=12){

    const line = new THREE.Mesh(
        new THREE.BoxGeometry(2,.03,.9),
        mat(0xffffff)
    );

    line.position.set(
        0,
        .04,
        z
    );

    scene.add(line);
}


/* =========================================================
   ROAD SIDE LINES
========================================================= */

for(const x of [-8.2,8.2]){

    const line = new THREE.Mesh(
        new THREE.BoxGeometry(.15,.04,350),
        mat(0xffffff)
    );

    line.position.set(
        x,
        .04,
        0
    );

    scene.add(line);
}


/* =========================================================
   BUILDING FUNCTION
========================================================= */

function createBuilding(
    x,
    z,
    width,
    height,
    depth,
    color
){

    const building = new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            height,
            depth
        ),
        mat(color)
    );

    building.position.set(
        x,
        height/2,
        z
    );

    building.castShadow = true;
    building.receiveShadow = true;

    scene.add(building);


    /* roof */

    const roof = new THREE.Mesh(
        new THREE.BoxGeometry(
            width+.3,
            .25,
            depth+.3
        ),
        mat(0x333333)
    );

    roof.position.set(
        x,
        height+.12,
        z
    );

    roof.castShadow = true;

    scene.add(roof);
}


/* =========================================================
   BUILDINGS
========================================================= */

createBuilding(
    -25,
    -20,
    14,
    9,
    16,
    0xb7b7b7
);

createBuilding(
    27,
    -55,
    17,
    12,
    18,
    0xc98f6d
);

createBuilding(
    -30,
    45,
    18,
    11,
    16,
    0x8ca4bd
);

createBuilding(
    30,
    65,
    15,
    8,
    15,
    0xd5c38c
);


/* =========================================================
   TREE FUNCTION
========================================================= */

function createTree(x,z){

    const tree = new THREE.Group();

    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(
            .35,
            .45,
            3,
            8
        ),
        mat(0x68452b)
    );

    trunk.position.y=1.5;

    trunk.castShadow=true;

    tree.add(trunk);


    const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(
            2.2,
            12,
            10
        ),
        mat(0x2f6b35)
    );

    leaves.position.y=4;

    leaves.castShadow=true;

    tree.add(leaves);


    tree.position.set(
        x,
        0,
        z
    );

    scene.add(tree);
}


/* =========================================================
   TREES
========================================================= */

for(let i=0;i<55;i++){

    const side =
        Math.random() < .5
        ? -1
        : 1;

    const x =
        side * (
            12 +
            Math.random()*45
        );

    const z =
        -160 +
        Math.random()*320;

    createTree(x,z);
}


/* =========================================================
   PLAYER
========================================================= */

const player = new THREE.Group();

player.position.set(
    0,
    0,
    8
);

scene.add(player);


/* =========================================================
   PLAYER MATERIALS
========================================================= */

const skin = mat(0xe0aa87);
const shirt = mat(0x26364d);
const pants = mat(0x20252c);
const hairMat = mat(0x151515);
const shoeMat = mat(0x111111);


/* =========================================================
   TORSO
========================================================= */

const torso = new THREE.Mesh(
    new THREE.CapsuleGeometry(
        .48,
        .9,
        8,
        16
    ),
    shirt
);

torso.position.y=1.65;

torso.castShadow=true;

player.add(torso);


/* =========================================================
   NECK
========================================================= */

const neck = new THREE.Mesh(
    new THREE.CylinderGeometry(
        .17,
        .19,
        .25,
        12
    ),
    skin
);

neck.position.y=2.35;

neck.castShadow=true;

player.add(neck);


/* =========================================================
   HEAD
========================================================= */

const head = new THREE.Mesh(
    new THREE.SphereGeometry(
        .43,
        24,
        20
    ),
    skin
);

head.scale.set(
    .95,
    1.1,
    .95
);

head.position.y=2.75;

head.castShadow=true;

player.add(head);


/* =========================================================
   HAIR
========================================================= */

const hair = new THREE.Mesh(
    new THREE.SphereGeometry(
        .45,
        24,
        16
    ),
    hairMat
);

hair.scale.set(
    1,
    .65,
    1
);

hair.position.set(
    0,
    3.04,
    -.03
);

hair.castShadow=true;

player.add(hair);


/* =========================================================
   HAIR SIDES
========================================================= */

for(const side of [-1,1]){

    const sideHair = new THREE.Mesh(
        new THREE.BoxGeometry(
            .13,
            .42,
            .5
        ),
        hairMat
    );

    sideHair.position.set(
        side*.39,
        2.83,
        -.01
    );

    sideHair.castShadow=true;

    player.add(sideHair);
}


/* =========================================================
   ARMS
========================================================= */

function createArm(side){

    const arm = new THREE.Mesh(
        new THREE.Capsule
