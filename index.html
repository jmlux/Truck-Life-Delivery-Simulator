<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Truck Life 3D</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}


/* HUD */

#hud {
    position: fixed;
    top: 12px;
    left: 12px;
    color: white;
    background: rgba(0,0,0,.55);
    padding: 12px;
    border-radius: 12px;
    z-index: 10;
    font-size: 14px;
    line-height: 1.6;
}

#title {
    font-size: 18px;
    font-weight: bold;
}


/* Mobile controls */

#controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 18px;
    display: flex;
    justify-content: space-between;
    padding: 0 18px;
    z-index: 20;
    pointer-events: none;
}

.controlGroup {
    display: flex;
    gap: 10px;
    pointer-events: auto;
}

button {
    width: 64px;
    height: 64px;
    border: none;
    border-radius: 18px;
    background: rgba(0,0,0,.65);
    color: white;
    font-size: 24px;
    font-weight: bold;
    touch-action: none;
}

button:active {
    transform: scale(.94);
    background: rgba(255,255,255,.25);
}

#hint {
    position: fixed;
    bottom: 92px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    background: rgba(0,0,0,.5);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 13px;
    z-index: 10;
    white-space: nowrap;
}

</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
    <div id="title">🚛 Truck Life 3D</div>
    <div>Mode: <span id="mode">Walking</span></div>
    <div>Speed: <span id="speed">0</span> km/h</div>
</div>

<div id="hint">
    Walk around • Explore your truck
</div>

<div id="controls">

    <div class="controlGroup">

        <button id="left">◀</button>

        <button id="right">▶</button>

    </div>

    <div class="controlGroup">

        <button id="forward">▲</button>

        <button id="back">▼</button>

    </div>

</div>


<!-- Three.js -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* =====================================================
   BASIC SETUP
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);


/* Camera */

const camera =
    new THREE.PerspectiveCamera(
        65,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );


/* Renderer */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* =====================================================
   LIGHTING
===================================================== */

const ambient =
    new THREE.HemisphereLight(
        0xffffff,
        0x555555,
        2
    );

scene.add(ambient);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    50,
    80,
    30
);

sun.castShadow = true;

scene.add(sun);


/* =====================================================
   GROUND
===================================================== */

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x5fa34a
    });


const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            300,
            300
        ),
        groundMaterial
    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =====================================================
   ROAD
===================================================== */

const roadMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x3d4145
    });


const road =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            300,
            .1,
            18
        ),
        roadMaterial
    );

road.position.y = .05;

scene.add(road);


/* Road markings */

for (
    let x = -140;
    x < 140;
    x += 14
) {

    const line =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                7,
                .12,
                .25
            ),
            new THREE.MeshStandardMaterial({
                color: 0xffe66d
            })
        );

    line.position.set(
        x,
        .12,
        0
    );

    scene.add(line);
}


/* =====================================================
   BUILDING FUNCTION
===================================================== */

function createBuilding(
    x,
    z,
    width,
    height,
    depth,
    color
) {

    const material =
        new THREE.MeshStandardMaterial({
            color: color
        });


    const building =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            material
        );


    building.position.set(
        x,
        height / 2,
        z
    );

    building.castShadow = true;
    building.receiveShadow = true;

    scene.add(building);

    return building;
}


/* Buildings */

createBuilding(
    -35,
    -25,
    18,
    8,
    15,
    0x59636c
);


createBuilding(
    35,
    -28,
    25,
    7,
    18,
    0x7a6651
);


createBuilding(
    -38,
    25,
    16,
    6,
    16,
    0x9a5863
);


/* =====================================================
   TREE FUNCTION
===================================================== */

function createTree(x, z) {

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .35,
                .45,
                3,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x6b4328
            })
        );

    trunk.position.set(
        x,
        1.5,
        z
    );

    trunk.castShadow = true;

    scene.add(trunk);


    const leaves =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2.2,
                10,
                10
            ),
            new THREE.MeshStandardMaterial({
                color: 0x287a35
            })
        );

    leaves.position.set(
        x,
        4,
        z
    );

    leaves.castShadow = true;

    scene.add(leaves);
}


for (
    let i = 0;
    i < 30;
    i++
) {

    const x =
        (Math.random() - .5) * 240;

    const z =
        (Math.random() - .5) * 240;

    if (
        Math.abs(z) < 14
    ) continue;

    createTree(x, z);
}


/* =====================================================
   PLAYER - MORE REALISTIC DRIVER
===================================================== */

const player = new THREE.Group();

scene.add(player);

player.position.set(
    0,
    0,
    8
);


/* =========================
   MATERIALS
========================= */

const skinMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xd7a47d,
        roughness: 0.8
    });

const hairMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x181818,
        roughness: 0.7
    });

const shirtMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x263746,
        roughness: 0.8
    });

const pantsMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x20242a,
        roughness: 0.9
    });

const shoeMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x111111,
        roughness: 0.8
    });


/* =========================
   BODY
========================= */

const torso =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            0.48,
            0.95,
            6,
            12
        ),
        shirtMaterial
    );

torso.position.y = 1.65;

torso.scale.set(
    1.05,
    1.15,
    0.65
);

torso.castShadow = true;

player.add(torso);


/* =========================
   NECK
========================= */

const neck =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.16,
            0.18,
            0.28,
            12
        ),
        skinMaterial
    );

neck.position.y = 2.35;

neck.castShadow = true;

player.add(neck);


/* =========================
   HEAD
========================= */

const head =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            0.43,
            24,
            24
        ),
        skinMaterial
    );

head.position.y = 2.75;

head.scale.set(
    0.95,
    1.08,
    0.9
);

head.castShadow = true;

player.add(head);


/* =========================
   HAIR
========================= */

const hair =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            0.45,
            24,
            16
        ),
        hairMaterial
    );

hair.position.y = 2.98;

hair.scale.set(
    1.0,
    0.55,
    0.95
);

hair.castShadow = true;

player.add(hair);


/* Side hair */

const leftHair =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.12,
            0.35,
            0.35
        ),
        hairMaterial
    );

leftHair.position.set(
    -0.39,
    2.78,
    0
);

player.add(leftHair);


const rightHair =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.12,
            0.35,
            0.35
        ),
        hairMaterial
    );

rightHair.position.set(
    0.39,
    2.78,
    0
);

player.add(rightHair);


/* =========================
   ARMS
========================= */

const armGeometry =
    new THREE.CapsuleGeometry(
        0.14,
        0.75,
        5,
        10
    );


const leftArm =
    new THREE.Mesh(
        armGeometry,
        shirtMaterial
    );

leftArm.position.set(
    -0.62,
    1.65,
    0
);

leftArm.rotation.z =
    -0.08;

leftArm.castShadow = true;

player.add(leftArm);


const rightArm =
    new THREE.Mesh(
        armGeometry,
        shirtMaterial
    );

rightArm.position.set(
    0.62,
    1.65,
    0
);

rightArm.rotation.z =
    0.08;

rightArm.castShadow = true;

player.add(rightArm);


/* =========================
   HANDS
========================= */

const leftHand =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            0.15,
            12,
            12
        ),
        skinMaterial
    );

leftHand.position.set(
    -0.66,
    1.18,
    0
);

player.add(leftHand);


const rightHand =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            0.15,
            12,
            12
        ),
        skinMaterial
    );

rightHand.position.set(
    0.66,
    1.18,
    0
);

player.add(rightHand);


/* =========================
   LEGS
========================= */

const legGeometry =
    new THREE.CapsuleGeometry(
        0.18,
        0.85,
        5,
        10
    );


const leftLeg =
    new THREE.Mesh(
        legGeometry,
        pantsMaterial
    );

leftLeg.position.set(
    -0.25,
    0.72,
    0
);

leftLeg.castShadow = true;

player.add(leftLeg);


const rightLeg =
    new THREE.Mesh(
        legGeometry,
        pantsMaterial
    );

rightLeg.position.set(
    0.25,
    0.72,
    0
);

rightLeg.castShadow = true;

player.add(rightLeg);


/* =========================
   SHOES
========================= */

const leftShoe =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.38,
            0.18,
            0.65
        ),
        shoeMaterial
    );

leftShoe.position.set(
    -0.25,
    0.12,
    0.12
);

leftShoe.castShadow = true;

player.add(leftShoe);


const rightShoe =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.38,
            0.18,
            0.65
        ),
        shoeMaterial
    );

rightShoe.position.set(
    0.25,
    0.12,
    0.12
);

rightShoe.castShadow = true;

player.add(rightShoe);


/* =========================
   WALKING ANIMATION
========================= */

player.userData.leftLeg =
    leftLeg;

player.userData.rightLeg =
    rightLeg;

player.userData.leftArm =
    leftArm;

player.userData.rightArm =
    rightArm;

player.userData.leftShoe =
    leftShoe;

player.userData.rightShoe =
    rightShoe;

player.userData.walkTime = 0;


    


/* =====================================================
   TRUCK
===================================================== */

const truck =
    new THREE.Group();


scene.add(truck);

truck.position.set(
    0,
    0,
    -5
);


/* Truck body */

const truckBody =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            3.2,
            2,
            6
        ),
        new THREE.MeshStandardMaterial({
            color: 0xb52b2b
        })
    );

truckBody.position.y =
    1.5;

truckBody.castShadow = true;

truck.add(truckBody);


/* Cabin */

const cabin =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            3,
            2.2,
            2.2
        ),
        new THREE.MeshStandardMaterial({
            color: 0x2e536d
        })
    );

cabin.position.set(
    0,
    2.2,
    1.7
);

cabin.castShadow = true;

truck.add(cabin);


/* Wheels */

function createWheel(x, z) {

    const wheel =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .65,
                .65,
                .45,
                16
            ),
            new THREE.MeshStandardMaterial({
                color: 0x151515
            })
        );

    wheel.rotation.z =
        Math.PI / 2;

    wheel.position.set(
        x,
        .65,
        z
    );

    wheel.castShadow = true;

    truck.add(wheel);
}


createWheel(-1.65, 1.7);
createWheel(1.65, 1.7);

createWheel(-1.65, -1.7);
createWheel(1.65, -1.7);


/* =====================================================
   PLAYER CONTROLS
===================================================== */

const keys = {
    forward: false,
    back: false,
    left: false,
    right: false
};


function bindButton(
    id,
    key
) {

    const button =
        document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            keys[key] = true;
        }
    );


    button.addEventListener(
        "pointerup",
        e => {

            e.preventDefault();

            keys[key] = false;
        }
    );


    button.addEventListener(
        "pointercancel",
        () => {

            keys[key] = false;
        }
    );


    button.addEventListener(
        "pointerleave",
        () => {

            keys[key] = false;
        }
    );
}


bindButton(
    "forward",
    "forward"
);

bindButton(
    "back",
    "back"
);

bindButton(
    "left",
    "left"
);

bindButton(
    "right",
    "right"
);


/* Keyboard */

window.addEventListener(
    "keydown",
    e => {

        if(e.key === "w")
            keys.forward = true;

        if(e.key === "s")
            keys.back = true;

        if(e.key === "a")
            keys.left = true;

        if(e.key === "d")
            keys.right = true;
    }
);


window.addEventListener(
    "keyup",
    e => {

        if(e.key === "w")
            keys.forward = false;

        if(e.key === "s")
            keys.back = false;

        if(e.key === "a")
            keys.left = false;

        if(e.key === "d")
            keys.right = false;
    }
);


/* =====================================================
   MOVEMENT
===================================================== */

let walkAnimation = 0;


function updatePlayer() {

    const speed = .10;

    if(keys.left) {

        player.rotation.y += .045;

    }


    if(keys.right) {

        player.rotation.y -= .045;

    }


    let moving = false;


    if(keys.forward) {

        player.translateZ(
            speed
        );

        moving = true;

    }


    if(keys.back) {

        player.translateZ(
            -speed
        );

        moving = true;

    }


    if(moving) {

        walkAnimation += .25;

        leftLeg.rotation.x =
            Math.sin(walkAnimation) * .6;

        rightLeg.rotation.x =
            Math.sin(
                walkAnimation + Math.PI
            ) * .6;

    }
    else {

        leftLeg.rotation.x = 0;
        rightLeg.rotation.x = 0;

    }


    document.getElementById(
        "speed"
    ).textContent =
        moving ? "5" : "0";
}


/* =====================================================
   THIRD PERSON CAMERA
===================================================== */

function updateCamera() {

    const cameraDistance = 8;

    const cameraHeight = 4.5;


    const offset =
        new THREE.Vector3(
            0,
            cameraHeight,
            -cameraDistance
        );


    offset.applyQuaternion(
        player.quaternion
    );


    const target =
        player.position.clone();


    target.y += 1.6;


    const desired =
        target.clone().add(offset);


    camera.position.lerp(
        desired,
        .12
    );


    camera.lookAt(
        target
    );
}


/* =====================================================
   ANIMATION LOOP
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    updatePlayer();

    updateCamera();


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
    </html>
